# Britishce44 TURN server configuration
# Media relay ports MUST match UFW allow range 30000:40000/udp+tcp
listening-port=3478
tls-listening-port=5349
realm=britishce44.com

fingerprint
lt-cred-mech
user=britishce44:turn_454b059a66ad0a22

# Relay (media) port range - kept inside the firewall-opened range
min-port=30000
max-port=40000

# Capacity
total-quota=300
user-quota=12
max-bps=3000000
stale-nonce=600
no-multicast-peers
no-cli

# TLS/DTLS with Let's Encrypt certs (enables turn:...:5349)
cert=/certs/fullchain.pem
pkey=/certs/privkey.pem
cipher-list=ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384

log-file=stdout

