version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: britishce44-db
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: britishce44
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: britishce44
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U britishce44"]
      interval: 5s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:latest
    container_name: britishce44-turn
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/britishce44/turn/turnserver.conf:/etc/turnserver.conf:ro
      - /opt/britishce44/turn/fullchain.pem:/certs/fullchain.pem:ro
      - /opt/britishce44/turn/privkey.pem:/certs/privkey.pem:ro
    command: >
      -n --log-file=stdout

volumes:
  pgdata:

